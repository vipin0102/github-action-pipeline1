name: CD

on:
    workflow_call:

jobs:
    Deploy:
        runs-on: self-hosted
        steps:
            - name: Code Clone
              uses: actions/checkout@v7
            - name: Docker Login
              uses: docker/login-action@v4
              with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.GITHUB_TOKEN}}
            - name: Docker Image Push and deploy
              run: |
                   docker pull ${{vars.DOCKERHUB_USERNAME}}/test:test1
                   docker run --name bkd -itd -p 4444:8080 ${{vars.DOCKERHUB_USERNAME}}/test:test1              